name: Visual Gallery CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler/compiled
