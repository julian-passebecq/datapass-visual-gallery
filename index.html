<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>DataPass — Reference Gallery</title>
<style>
:root{font:14px system-ui,sans-serif;color-scheme:dark;background:#0d1016;color:#e9eef7}
*{box-sizing:border-box}body{margin:0}header{padding:18px 20px;border-bottom:1px solid #29313c;position:sticky;top:0;background:#10141bdc;backdrop-filter:blur(10px);z-index:2}
h1{font-size:19px;margin:0 0 5px}p{color:#abb7c5;margin:5px 0 14px}.controls{display:flex;gap:8px;flex-wrap:wrap}input,select,button{border:1px solid #303c4c;background:#191f2a;border-radius:8px;padding:9px 11px;color:inherit;font:inherit}input{min-width:210px;flex:2}select{flex:1;min-width:135px}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #8bbef0;outline-offset:2px}
main{padding:20px}.status{min-height:30px;color:#a9b8c8}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{border:1px solid #303b48;border-radius:12px;overflow:hidden;background:#151b24;min-width:0;cursor:pointer}
.card:hover{border-color:#7892b1}.cover{aspect-ratio:16/11;background:#222b37;display:flex;align-items:center;justify-content:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;transition:transform .25s}.card:hover .cover img{transform:scale(1.10)}
.cardmain{padding:10px}.title{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{font-size:12px;color:#a5b2c2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:10px;background:#263041;border-radius:6px;padding:3px 6px;color:#c0cad8}
dialog{background:#151b23;color:inherit;border:1px solid #4b5a6d;border-radius:14px;padding:16px;max-width:min(950px,95vw);max-height:90vh;width:900px}dialog::backdrop{background:#050910d9}.modalhead{display:flex;justify-content:space-between;gap:12px}.modalhead h2{margin:0 0 8px;font-size:20px}.preview{max-width:100%;max-height:55vh;object-fit:contain;display:block;margin:10px auto}.detail{white-space:pre-wrap;color:#bfc9d7}a{color:#9bc7ef}footer{padding:12px 20px;color:#9ba6b4}
@media(max-width:950px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}.controls input,.controls select{min-width:100%}}@media(max-width:340px){.gallery{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>DataPass · Reference Gallery</h1><p>Catalogue Git vérifié · médias privés accessibles uniquement après authentification</p>
<div class="controls"><input id="search" placeholder="Rechercher titre, résumé, tags…" aria-label="Recherche"><select id="purpose" aria-label="Purpose"><option value="">Tous les usages</option></select><select id="scope" aria-label="Scope"><option value="">Tous les scopes</option></select><select id="tag" aria-label="Tags"><option value="">Tous les tags</option></select><button id="reload">Actualiser</button></div></header>
<main><div id="status" class="status" role="status" aria-live="polite">Chargement…</div><div id="gallery" class="gallery"></div></main>
<dialog id="detail"><div class="modalhead"><h2 id="detailTitle"></h2><button id="close">Fermer</button></div><img id="preview" class="preview" alt=""><div id="detailText" class="detail"></div><p><a id="source" target="_blank" rel="noopener noreferrer">Ouvrir la source</a></p></dialog>
<footer>Read-only · aucune écriture MongoDB · aucun accès R2 public</footer>
<script type="module">
const $=id=>document.getElementById(id);const fields=['purpose','scope','tag'];let records=[],current=[];
const str=v=>typeof v==='string'?v:'';const arr=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):[];
const distinct=(key)=>Array.from(new Set(records.flatMap(r=>arr(r[key])))).sort((a,b)=>a.localeCompare(b));
function selectOptions(id,values){const e=$(id),old=e.value;e.replaceChildren(new Option(id==='tag'?'Tous les tags':id==='scope'?'Tous les scopes':'Tous les usages',''));for(const v of values)e.add(new Option(v,v));e.value=values.includes(old)?old:''}
function safeMedia(r){return r.asset_id?'/api/media/'+encodeURIComponent(r.asset_id):''}
function render(){const q=$('search').value.trim().toLocaleLowerCase();current=records.filter(r=>{const hay=[r.title,r.summary,...r.tags,...r.scopes,...r.purposes].join(' ').toLocaleLowerCase();return (!q||hay.includes(q))&&(!$('purpose').value||r.purposes.includes($('purpose').value))&&(!$('scope').value||r.scopes.includes($('scope').value))&&(!$('tag').value||r.tags.includes($('tag').value))});const g=$('gallery');g.replaceChildren();$('status').textContent=current.length+' référence(s) sur '+records.length;
for(const r of current){const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Afficher '+r.title);const cover=document.createElement('div');cover.className='cover';const url=safeMedia(r);if(url){const im=document.createElement('img');im.src=url;im.loading='lazy';im.alt='Aperçu de '+r.title;im.onerror=()=>{cover.textContent='Image indisponible';im.remove()};cover.append(im)}else cover.textContent='Sans aperçu';const main=document.createElement('div');main.className='cardmain';const title=document.createElement('div');title.className='title';title.textContent=r.title;const desc=document.createElement('div');desc.className='desc';desc.textContent=r.summary;const chips=document.createElement('div');chips.className='chips';for(const t of r.tags.slice(0,4)){const chip=document.createElement('span');chip.className='chip';chip.textContent=t;chips.append(chip)}main.append(title,desc,chips);card.append(cover,main);card.onclick=()=>show(r);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(r)}};g.append(card)}}
function show(r){$('detailTitle').textContent=r.title;$('detailText').textContent=r.summary+'\n\nScope : '+r.scopes.join(', ')+'\nPurpose : '+r.purposes.join(', ')+'\nTags : '+r.tags.join(', ')+'\nRéférence : '+r.reference_id;const im=$('preview'),url=safeMedia(r);im.hidden=!url;im.src=url||'';$('source').hidden=!/^https:\/\//.test(r.source_url);if(!$('source').hidden)$('source').href=r.source_url;$('detail').showModal()}
async function load(){const g=$('gallery');g.replaceChildren();$('status').textContent='Chargement sécurisé du catalogue…';try{const res=await fetch('/api/catalog',{credentials:'same-origin',cache:'no-store'});if(res.status===401||res.status===403)throw Error('Accès privé non autorisé ('+res.status+'). Authentification requise.');if(!res.ok)throw Error('Catalogue indisponible (HTTP '+res.status+').');const data=await res.json();if(data.schema_version!=='datapass.reference-catalog/1'||!Array.isArray(data.references))throw Error('Format du catalogue invalide.');records=data.references.map(r=>({reference_id:str(r.reference_id),title:str(r.title)||'Sans titre',summary:str(r.summary),source_url:str(r.source_url),asset_id:str(r.asset_id),tags:arr(r.tags),scopes:arr(r.scopes),purposes:arr(r.purposes)}));for(const f of fields)selectOptions(f,distinct(f==='tag'?'tags':f==='scope'?'scopes':'purposes'));render()}catch(e){records=[];$('status').textContent=String(e.message||e)+' Le catalogue privé reste préservé.'}}
for(const f of [...fields,'search'])$(f).addEventListener('input',render);$('reload').onclick=load;$('close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};load();
</script></body></html>
